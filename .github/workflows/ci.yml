name: CI

# Runs on every pull request and every push to main (no path filters, so the
# required checks always report). Job display names below are what branch
# protection / the ruleset refer to; do not rename them.
# Containers come from public.ecr.aws, never Docker Hub (anonymous pull limits).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Ruff (pinned)
        # Configuration lives in pyproject.toml. Pinned so results match local runs.
        run: pipx run ruff==0.16.1 check .

      - name: Install pinned shellcheck
        # The runner image's shellcheck version drifts; pin a release and verify
        # its checksum so lint results are the same locally and in CI.
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      - name: shellcheck (installers and e2e scripts)
        # Configuration comes from .shellcheckrc.
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck

  unit:
    name: Unit tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian 12
            image: public.ecr.aws/docker/library/debian:12
          - name: debian 13
            image: public.ecr.aws/docker/library/debian:13
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Python and pytest
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3 python3-pytest

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run unit tests
        run: |
          python3 --version
          python3 -m pytest

  e2e:
    name: E2E (debian container)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container: public.ecr.aws/docker/library/debian:12
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run end-to-end test
        # Starts real dnsmasq processes and the real dns-upstream-check.py
        # inside this throwaway job container; installs its own packages.
        env:
          SRC: ${{ github.workspace }}
        run: timeout 300 bash tests/e2e/in-container.sh
