# Tests the repository's agent tooling: the Claude Code Bash guard hook under
# .claude/hooks/ (it keeps agents from running installers, configure.py,
# monitor.py, sudo or systemctl on the DNS host, from calling the Tailscale API,
# and from writing to the wrong GitHub repository) and checks that
# .claude/settings.json is valid JSON. Only Node is used; there is no npm install
# in the agent-tooling job.
#
# The `mutation` job is advisory and never a required check: on a pull request
# it mutates the changed lines of .claude/hooks/*.mjs and scripts/*.mjs with a
# pinned StrykerJS installed outside the checkout (the repository keeps no
# package.json) and lists every mutant no test notices. See docs/quality.md.
name: Agent tooling

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: agent-tooling-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-tooling:
    name: agent-tooling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate .claude/settings.json
        run: |
          node -e '
            const s = JSON.parse(require("node:fs").readFileSync(".claude/settings.json", "utf8"));
            for (const key of ["allow", "ask", "deny"]) {
              if (!Array.isArray(s.permissions?.[key])) throw new Error("permissions." + key + " is missing");
            }
            if (!s.hooks?.PreToolUse?.some((e) => e.matcher === "Bash")) throw new Error("no PreToolUse hook for Bash");
          '

      - name: Run hook tests
        run: node --test '.claude/hooks/tests/*.test.mjs'

      - name: Run script tests
        run: node --test 'scripts/tests/*.test.mjs'

  mutation:
    name: Mutation check on changed lines (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Stryker (pinned, not saved)
        run: npm install --prefix "$RUNNER_TEMP/stryker" --no-save --ignore-scripts --no-audit --no-fund @stryker-mutator/core@10.0.0

      - name: Mutate changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/mutation-check.mjs --base "origin/$BASE_REF" --stryker "$RUNNER_TEMP/stryker/node_modules/.bin/stryker"
