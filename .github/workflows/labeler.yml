# Labels pull requests by the paths they change, using .github/labeler.yml
# (actions/labeler v5).
#
# Trigger: `pull_request`, not `pull_request_target`. The labeler never checks
# out or runs PR code, so `pull_request_target` would be safe here, but it is
# not needed: PRs from branches in this repository get a write-capable
# GITHUB_TOKEN under `pull_request`. The tradeoff: a PR from a fork receives a
# read-only token, so labeling it fails to write and the PR stays unlabeled.
# That is acceptable here, and avoids a privileged trigger. The job is skipped
# for fork PRs so they do not show a red check.
#
# Labels (`area/*`: local-dns, tailscale, installer, systemd, tests, ci, docs, agents, governance) missing from the repository are created on first use (default
# colour, no description); `sync-labels` removes a label when its
# paths are no longer touched. Issues are not labeled by path; they have none.

name: Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label:
    permissions:
      contents: read
      pull-requests: write
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
