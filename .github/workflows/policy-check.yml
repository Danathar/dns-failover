name: Policy check

# Runs scripts/check-policies.mjs: the repo-target, workflow-permissions,
# installer-safety and credential-safety policies in policies/, the drift check
# between docs/risk-tiers.md and risk-config.json, and CODEOWNERS coverage of
# owner-review paths; then the checker's own tests. Node built-ins only, so
# there is no npm install. See policies/README.md.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: policy-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-check:
    name: policy-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check policies
        run: node scripts/check-policies.mjs

      - name: Test the policy checker
        run: node --test scripts/tests/check-policies.test.mjs
