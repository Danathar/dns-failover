# AI fix requested. Human-triggered, never automatic. It runs only when a
# maintainer explicitly asks, by applying the `ai-fix-requested` label to an
# issue or pull request, or by commenting `/ai-fix` on one. It then runs the
# Claude Code GitHub Action (the same one claude.yml uses) to verify review
# findings and apply the ones that hold up.
#
# Why not automatic: review findings need checking before they are applied.
# In the owner's other repositories, automated findings were sometimes
# factually wrong or correct but not actionable (they needed a merge order,
# not a code change). Verification is the value, so a person asks for it.
# The agent is told to apply docs/review-rubric.md and to report findings it
# rejects instead of forcing a change.
#
# Gating:
#   - Events sent by a bot are skipped before any step runs. The Hive GitHub
#     App (`danathar-atomic-hive[bot]`) applies `ai-fix-requested` to the
#     issues it files, and the collaborator API answers `none` for an app, so
#     a refusal would leave a red run nobody can act on. Skipping is grey.
#   - A `/ai-fix` comment from anyone but OWNER, MEMBER or COLLABORATOR is
#     skipped the same way. Only someone with triage access can label, so the
#     label path needs no association test; the permission check below is the
#     real control either way.
#   - For a PR, only a same-repository head branch is accepted. A fork PR
#     (`isCrossRepository`) or a closed PR is refused with a comment, because
#     this job holds a write token and an Anthropic credential and must not
#     check out untrusted fork code.
#   - With neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN set, the job
#     acknowledges, writes a step summary about the missing secret, and skips
#     the agent. It does not fail red. Set exactly one of the two.
#
# No `pull_request_target`: paired with write permissions it is the classic
# privilege-escalation shape. `issue_comment` also fires on PRs, so `/ai-fix`
# reaches a PR without it. The `pull_request: labeled` trigger gets a
# read-only token for fork PRs, and the same-repository test below skips them.
#
# The allowlist is a speed bump, not a sandbox. It keeps the agent from casually
# running `gh api -X PUT .../merge`, git aliases or `--receive-pack`, but it
# cannot stop code the agent writes itself (Edit/Write plus `python3 -m pytest`
# runs arbitrary shell). Treat everything the agent reads as a possible prompt
# injection. Mitigations: only maintainers can trigger a run,
# `CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'` strips credentials from subprocess
# environments, and branch protection still gates what is pushed.
#
# Checks on agent pushes: commits pushed and PRs opened with the workflow's
# GITHUB_TOKEN do not start other workflows (a GitHub rule against recursive
# runs), so `CI` and `Coverage gate` will not run on what the agent pushes. No
# PAT is used on purpose. The agent's closing comment tells the maintainer to
# re-run checks (close and reopen the PR, or push an empty commit by hand);
# the required checks stay pending until then.
#
# Rules for the agent are in AGENTS.md; gh write commands use
# `--repo Danathar/dns-failover`. The host rule (no sudo, installers, configure.py, monitor.py,
# systemctl or Tailscale API calls on the host) is repeated in the prompt; code is
# exercised only through the unit tests and the throwaway-container e2e test.

name: AI fix requested

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: ai-fix-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  requested:
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    if: >-
      github.event.sender.type != 'Bot' && (
        (
          github.event_name == 'issues' &&
          github.event.label.name == 'ai-fix-requested'
        ) || (
          github.event_name == 'pull_request' &&
          github.event.label.name == 'ai-fix-requested' &&
          github.event.pull_request.head.repo.full_name == github.repository
        ) || (
          github.event_name == 'issue_comment' &&
          startsWith(github.event.comment.body, '/ai-fix') && (
            github.event.comment.author_association == 'OWNER' ||
            github.event.comment.author_association == 'MEMBER' ||
            github.event.comment.author_association == 'COLLABORATOR'
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check requester is a maintainer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          role=$(gh api "repos/$GH_REPO/collaborators/$ACTOR/permission" \
                   --jq '.permission' 2>/dev/null || echo none)
          case "$role" in
            admin|maintain|write) echo "$ACTOR has $role; proceeding" ;;
            *) echo "::error::$ACTOR lacks write access (got '$role'); refusing."; exit 1 ;;
          esac

      - name: Resolve target and refuse fork or closed PRs
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event_name == 'pull_request' || github.event.issue.pull_request != null }}
        run: |
          ref=""
          proceed=true
          if [ "$IS_PR" = "true" ]; then
            read -r cross state head < <(gh pr view "$NUM" --repo "$GH_REPO" \
              --json isCrossRepository,state,headRefName \
              --jq '[.isCrossRepository, .state, .headRefName] | @tsv')
            if [ "$cross" = "true" ]; then
              proceed=false
              reason="PR #$NUM comes from a fork. AI fix only works on same-repository branches."
            elif [ "$state" != "OPEN" ]; then
              proceed=false
              reason="PR #$NUM is $state; nothing to fix."
            else
              ref="$head"
            fi
          fi
          if [ "$proceed" = "false" ]; then
            gh issue comment "$NUM" --repo "$GH_REPO" --body "AI fix refused: $reason"
            {
              echo "## AI fix refused"
              echo
              echo "$reason"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "proceed=$proceed"
            echo "ref=$ref"
            echo "is_pr=$IS_PR"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.target.outputs.proceed == 'true'
        with:
          ref: ${{ steps.target.outputs.ref }}
          fetch-depth: 0

      - name: Acknowledge the request
        if: steps.target.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          gh issue comment "$NUM" --repo "$GH_REPO" --body "$(printf 'AI fix requested by @%s ([run](%s/%s/actions/runs/%s)).\n\nBefore applying anything, the agent reads %s and %s. It verifies each finding against the code first, and reports findings it rejects instead of forcing a change.\n' \
            "$GITHUB_ACTOR" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" 'AGENTS.md' 'docs/review-rubric.md')"

      - name: Detect Anthropic credential
        id: auth
        if: steps.target.outputs.proceed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## AI fix requested"
              echo
              echo "Gating and acknowledgement ran. The agent step was skipped"
              echo "because this repository has no Anthropic credential."
              echo
              echo "To enable it, add one repository secret:"
              echo "- \`ANTHROPIC_API_KEY\` (API billing), or"
              echo "- \`CLAUDE_CODE_OAUTH_TOKEN\` (from \`claude setup-token\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Read-only helper for the agent. `gh api` is not allowlisted directly:
      # a prefix rule would also approve `-X PUT .../merge`, and adding fields
      # flips gh to POST. This script hardcodes the method and repository and
      # accepts only a fixed kind plus a numeric id, so there is nothing to inject.
      - name: Install read-only review fetcher
        if: steps.target.outputs.proceed == 'true' && steps.auth.outputs.configured == 'true'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/gh-review-read.sh" <<'SCRIPT'
          #!/bin/bash
          # usage: gh-review-read.sh <pr-comments|pr-reviews|issue-comments> <number>
          set -euo pipefail
          kind="${1:-}"
          num="${2:-}"
          [[ "$num" =~ ^[0-9]+$ ]] || { echo "number must be digits" >&2; exit 2; }
          case "$kind" in
            pr-comments) path="pulls/$num/comments" ;;
            pr-reviews) path="pulls/$num/reviews" ;;
            issue-comments) path="issues/$num/comments" ;;
            *) echo "kind must be pr-comments, pr-reviews or issue-comments" >&2; exit 2 ;;
          esac
          exec gh api --method GET --paginate "repos/Danathar/dns-failover/$path"
          SCRIPT
          sed -i 's/^          //' "$RUNNER_TEMP/gh-review-read.sh"
          chmod 0755 "$RUNNER_TEMP/gh-review-read.sh"

      # The runner image drifts; install what the agent is told to run
      # (pytest from apt, pinned ruff from PyPI, pinned shellcheck release).
      - name: Install pytest, ruff and pinned shellcheck
        if: steps.target.outputs.proceed == 'true' && steps.auth.outputs.configured == 'true'
        env:
          RUFF_VERSION: 0.16.1
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pytest python3-pip python3-coverage jq
          python3 -m pip install --user --break-system-packages "ruff==${RUFF_VERSION}"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}" >> "$GITHUB_PATH"

      # anthropics/claude-code-action v1.0.248 (annotated tag dereferenced to
      # its commit). Input names checked against that release's action.yml.
      # A `prompt` runs the action in agent mode, so no @claude mention is needed.
      - name: Apply verified findings
        if: steps.target.outputs.proceed == 'true' && steps.auth.outputs.configured == 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        env:
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: '1'
          TARGET_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          additional_permissions: |
            actions: read
          prompt: |
            A maintainer asked for an AI fix on ${{ github.repository }}#${{ github.event.issue.number || github.event.pull_request.number }} (pull request: ${{ steps.target.outputs.is_pr }}).

            Read AGENTS.md first. Every gh pr, gh issue, gh release and gh workflow command must pass --repo Danathar/dns-failover. Host rule: never run, on the host, sudo, install-dns-failover.sh, tailscale-dns-failover/install.sh, tailscale-dns-failover/configure.py, tailscale-dns-failover/monitor.py in any mode (--dry-run still calls the live Tailscale API with real credentials), dns-upstream-check.py against real paths or without --no-reload, systemctl or service actions on dnsmasq, stubby or the units, or any Tailscale API call. Exercise code only through python3 -m pytest (fakes, temp dirs) and tests/e2e/run.sh inside a throwaway container. Never put credentials or site-specific values (ControlD profile IDs, LAN addresses, tailnet names) in the repo.

            1. Read the issue or PR with `gh issue view` or `gh pr view`, using --repo Danathar/dns-failover. `gh pr view` does not return inline review comments; fetch them with `${{ runner.temp }}/gh-review-read.sh pr-comments <number>` (inline comments) and `${{ runner.temp }}/gh-review-read.sh pr-reviews <number>` (review summaries). That script is read-only; do not call `gh api` directly.
            2. For each finding, verify the claim against the code at this checkout. Judge it by docs/review-rubric.md. Skip, and say why, any finding that is wrong, not actionable, or needs a merge order instead of a code change.
            3. For a pull request, commit the fixes to the checked-out head branch and push with exactly `git push -u origin HEAD` (no other push form is permitted). For an issue, create a branch from main with `git switch -c <branch>`, push with exactly `git push -u origin HEAD`, then open a PR with `gh pr create --repo Danathar/dns-failover --base main --head <branch>`.
            4. Before committing, run `python3 -m pytest`, `ruff check .` and `shellcheck` on any changed shell script; for workflow or policy changes also `node --test 'scripts/tests/*.test.mjs'`, `node --test '.claude/hooks/tests/*.test.mjs'` and `node scripts/check-policies.mjs`. Follow CLAUDE.md for style. Do not merge anything.
            5. Finish with one comment (`gh issue comment --repo Danathar/dns-failover` or `gh pr comment --repo Danathar/dns-failover`) listing which findings you applied and which you rejected, with the reason for each. Pushes and PRs made with the workflow token do not start CI, so if you pushed or opened a PR, end the comment by telling the maintainer to re-run the checks (close and reopen the PR, or push an empty commit) before the required checks can pass.
          claude_args: >-
            --max-turns 40
            --append-system-prompt "Work only on Danathar/dns-failover, pass --repo Danathar/dns-failover to every gh write command, push only to origin. Host rule: never run, on the host, sudo, install-dns-failover.sh, tailscale-dns-failover/install.sh, tailscale-dns-failover/configure.py, tailscale-dns-failover/monitor.py in any mode (--dry-run still calls the live Tailscale API with real credentials), dns-upstream-check.py against real paths or without --no-reload, systemctl or service actions on dnsmasq, stubby or the units, or any Tailscale API call. Exercise code only through python3 -m pytest (fakes, temp dirs) and tests/e2e/run.sh inside a throwaway container. Never put credentials or site-specific values (ControlD profile IDs, LAN addresses, tailnet names) in the repo. See AGENTS.md."
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git add:*),Bash(git commit:*),Bash(git checkout:*),Bash(git switch:*),Bash(git push origin HEAD),Bash(git push -u origin HEAD),Bash(gh pr create --repo Danathar/dns-failover:*),Bash(gh pr view --repo Danathar/dns-failover:*),Bash(gh pr comment --repo Danathar/dns-failover:*),Bash(gh issue view --repo Danathar/dns-failover:*),Bash(${{ runner.temp }}/gh-review-read.sh:*),Bash(gh issue comment --repo Danathar/dns-failover:*),Bash(python3 -m pytest:*),Bash(ruff check:*),Bash(shellcheck:*),Bash(sh -n:*),Bash(node --test 'scripts/tests/*.test.mjs'),Bash(node --test '.claude/hooks/tests/*.test.mjs'),Bash(node scripts/check-policies.mjs)"
